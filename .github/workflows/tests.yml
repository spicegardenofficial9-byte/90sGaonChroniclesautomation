name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "config/**", "requirements.txt"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
