title: "Gaon Ki Holi | 90s Wali Masti, Gulal Aur Gujiya 🎨"
topic: "Holi"
summary: >
  Holi ki subah se lekar shaam tak, kaise poora gaon rang, dhol aur gujiya
  ke saath ek ho jaata tha: tesu ke phoolon ka rang, pichkari ki ladaai aur
  dadi ke haath ki thandai.
highlights:
  - "Tesu ke phoolon se ghar pe bana natural rang"
  - "Pital ki pichkari aur mohalle ki toli"
  - "Dadi ki thandai aur gujiya ki khushboo"
  - "Shaam ko Holika ke paas gaon ka mela"
keywords: ["holi", "village holi", "gujiya", "thandai", "tesu flowers", "90s holi"]
location: "Purvanchal, Uttar Pradesh"
year: "1996"
language: hinglish           # hinglish | hindi | english

