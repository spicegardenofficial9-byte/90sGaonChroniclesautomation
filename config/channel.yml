# Channel-wide defaults. Every value here can be overridden per video in
# videos/inbox/<slug>/meta.yml.

channel:
  name: "90s Gaon Chronicles"
  # Short description of the channel. It gives the AI context when it writes descriptions.
  niche: >
    Nostalgic stories and slice-of-life videos about growing up in an Indian
    village in the 1990s: gaon ki galiyan, school days, festivals, old games,
    Doordarshan evenings, chulha cooking, monsoon, fairs and family life.
  audience: "Indians (and the diaspora) who grew up in the 80s/90s and miss village life"
  default_language: "hinglish"   # hinglish | hindi | english
  tone: "warm, nostalgic, storytelling, respectful, lightly humorous"

  # Always added to every video (counted in YouTube's 15-hashtag limit).
  brand_hashtags: ["#90sGaonChronicles"]

  # Broad pool the generator can draw from. Each tag's usage is tracked in
  # data/hashtag_history.json so that less-used tags are preferred.
  hashtag_pool:
    - "#90sKids"
    - "#90sNostalgia"
    - "#VillageLife"
    - "#GaonKiYaadein"
    - "#DesiNostalgia"
    - "#IndianVillage"
    - "#ChildhoodMemories"
    - "#PuranaZamana"
    - "#RuralIndia"
    - "#DesiVibes"
    - "#Nostalgia"
    - "#BachpanKeDin"
    - "#OldIsGold"
    - "#GaonKaJeevan"

  # Appended to every description (links, CTA, credits).
  footer: |
    🔔 Subscribe to 90s Gaon Chronicles for more gaon ki kahaniyan:
    https://www.youtube.com/@90sGaonChronicles?sub_confirmation=1

    📩 Business / collaborations: add-your-email@example.com

upload:
  category_id: "22"            # 22 = People & Blogs, 24 = Entertainment, 19 = Travel & Events
  privacy_status: "private"    # every video is first uploaded as a PRIVATE preview
  publish_privacy: "public"    # what "publish" changes it to after approval (public | unlisted)
  default_publish_time: "18:00"  # IST. --direct uploads go public at the next free day at this time ("" = immediately)
  made_for_kids: false
  contains_synthetic_media: false  # set true if any part is AI-generated/realistic-altered
  default_language: "hi"
  playlist_id: ""              # optional: add every upload to this playlist
  notify_subscribers: true

edit:
  format: "landscape"          # landscape (1920x1080) | short (1080x1920)
  fps: 30
  look: "vintage"              # vintage | vhs | none
  title_overlay: true          # show the title text for the first few seconds
  title_overlay_seconds: 4
  music_volume: 0.12           # background music level under the original audio
  loudness_lufs: -14           # YouTube's loudness target
  crf: 20
  preset: "medium"

metadata:
  use_ai: true                 # uses Claude when ANTHROPIC_API_KEY is set; falls back to templates
  model: "claude-opus-5"
  max_hashtags: 12             # YouTube ignores ALL hashtags if there are more than 15
  min_new_hashtags: 3          # each video gets at least this many hashtags never used before
  max_hashtag_overlap: 0.5     # max Jaccard similarity to any previous video's hashtag set
  max_description_similarity: 0.6  # 0..1, reject descriptions too close to an older one

pipeline:
  max_videos_per_run: 1        # an upload costs 1600 of the 10,000 daily YouTube API quota units
  cleanup_inbox_after_upload: false  # true = git rm the raw clips after a successful upload
